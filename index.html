<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahmed Video Uploader 927</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:720px;margin:40px auto;padding:0 18px;line-height:1.5}
.card{border:1px solid #ddd;border-radius:14px;padding:22px;margin:16px 0}
button{padding:11px 16px;border:0;border-radius:9px;cursor:pointer}
input{margin:10px 0;max-width:100%}
#status{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:9px}
</style>
</head>
<body>
<h1>Ahmed Video Uploader 927</h1>
<p>Upload a video to your TikTok inbox through the Content Posting API.</p>
<div class="card">
<h2>1. TikTok Login</h2>
<button onclick="loginTikTok()">Continue with TikTok</button>
<p id="loginState">Checking login...</p>
</div>
<div class="card">
<h2>2. Upload video to TikTok Inbox</h2>
<input id="video" type="file" accept="video/mp4,video/quicktime,video/webm">
<br>
<button onclick="uploadVideo()">Upload to TikTok</button>
</div>
<div class="card">
<h2>Status</h2>
<div id="status">Ready.</div>
</div>
<p><a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a></p>
<script>
async function refreshSession(){
  try{
    const r=await fetch('/api/session');
    const d=await r.json();
    document.getElementById('loginState').textContent=d.logged_in?'TikTok connected.':'Not connected.';
  }catch(e){document.getElementById('loginState').textContent='Could not check session.';}
}
function loginTikTok(){location.href='/oauth/tiktok';}
async function uploadVideo(){
  const file=document.getElementById('video').files[0];
  const status=document.getElementById('status');
  if(!file){status.textContent='Choose a video first.';return;}
  status.textContent='Uploading...';
  const fd=new FormData(); fd.append('video',file);
  try{
    const r=await fetch('/api/upload',{method:'POST',body:fd});
    const d=await r.json();
    status.textContent=JSON.stringify(d,null,2);
  }catch(e){status.textContent='Upload error: '+e;}
}
refreshSession();
if(new URLSearchParams(location.search).get('login')==='success'){
 document.getElementById('status').textContent='TikTok login succeeded. You can upload a video now.';
}
</script>
</body>
</html>
